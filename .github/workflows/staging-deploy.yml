# Staging (Vultr) deploy — manual trigger only. Lets an agent/operator run
# the STAGING_DEPLOY.md flow through GitHub-hosted runners (which have SSH
# egress) without local SSH access. Requires the STAGING_SSH_KEY repo secret:
# a private key whose public half is in root@104.207.131.136's
# authorized_keys. Production (Vercel) is untouched by this workflow.
name: staging-deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          rebrand-perlstein = flip staging to the Perlstein white-label demo
          (scripts/rebrand-demo-perlstein.sh). main = plain redeploy of main.
        required: true
        default: rebrand-perlstein
        type: choice
        options:
          - rebrand-perlstein
          - main
  # Agent path: integrations without actions:write can't dispatch, but they
  # can push. Touching .github/staging-deploy-trigger on this branch fires a
  # deploy; the file's first line selects the mode (rebrand-perlstein | main).
  push:
    branches:
      - claude/kupman-system-perlstein-adapt-1f7u5f
    paths:
      - .github/staging-deploy-trigger

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_HOST: 104.207.131.136
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            MODE="$(head -1 .github/staging-deploy-trigger 2>/dev/null | tr -d '[:space:]')"
          fi
          case "$MODE" in rebrand-perlstein|main) ;; *) MODE=rebrand-perlstein ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "resolved mode: $MODE"

      - name: Install SSH key
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -z "$STAGING_SSH_KEY" ]; then
            echo "::error::STAGING_SSH_KEY secret is not set — add it in repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_staging
          chmod 600 ~/.ssh/id_staging
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (${{ steps.mode.outputs.mode }})
        run: |
          SSH="ssh -i ~/.ssh/id_staging -o BatchMode=yes root@$STAGING_HOST"
          if [ "${{ steps.mode.outputs.mode }}" = "rebrand-perlstein" ]; then
            $SSH "curl -fsSL https://raw.githubusercontent.com/Shmuel18/first-crm/claude/kupman-system-perlstein-adapt-1f7u5f/scripts/rebrand-demo-perlstein.sh | SKIP_CONFIRM=1 bash"
          else
            $SSH "docker rm -f first-crm_test 2>/dev/null; curl -fsSL https://raw.githubusercontent.com/Shmuel18/first-crm/main/scripts/deploy.sh -o /opt/deploy-first-crm.sh && SKIP_MIGRATIONS=1 bash /opt/deploy-first-crm.sh"
          fi

      - name: Verify from outside
        run: |
          body="$(curl -s "http://$STAGING_HOST:3747/api/health")"
          echo "health: $body"
          echo "$body" | grep -q '"ok":true' || { echo '::error::health check failed'; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://$STAGING_HOST:3747/login")"
          echo "/login -> $code"
          [ "$code" = "200" ] || { echo '::error::/login not 200'; exit 1; }
